platforms:
  - id: platform0
    name: Governance & Configuration
    consumes: []
    produces:
      - name: registries
        version: "1.0"
      - name: OS_rules
        version: "1.0"
    allowed_imports: []
    forbidden_imports: ["*"]

  - id: platform1
    name: Data Platform
    consumes:
      - name: external_feeds
        version: ">=1.0"
    produces:
      - name: raw_ticks
        version: "1.0"
    allowed_imports: ["platform0"]
    forbidden_imports: ["platform2", "platform3", "platform4", "platform5", "platform6", "platform7", "platform8", "platform9", "platform10", "platform11", "platform12", "platform13", "platform14", "platform15", "platform16", "platform17", "platform18", "platform19", "platform20", "platform21", "platform22", "platform23", "platform24"]

  - id: platform2
    name: Universe & Screening
    consumes:
      - name: platform0.registries
        version: ">=1.0"
    produces:
      - name: universe_definition
        version: "1.0"
    allowed_imports: ["platform0"]
    forbidden_imports: ["platform3", "platform4", "platform5", "platform6", "platform7", "platform8", "platform9", "platform10", "platform11", "platform12", "platform13", "platform14", "platform15", "platform16", "platform17", "platform18", "platform19", "platform20", "platform21", "platform22", "platform23", "platform24"]

  - id: platform3
    name: Asset Intelligence
    consumes:
      - name: universe_definition
        version: ">=1.0"
    produces:
      - name: static_metadata
        version: "1.0"
    allowed_imports: ["platform0", "platform2"]
    forbidden_imports: ["platform4", "platform5", "platform6", "platform7", "platform8", "platform9", "platform10", "platform11", "platform12", "platform13", "platform14", "platform15", "platform16", "platform17", "platform18", "platform19", "platform20", "platform21", "platform22", "platform23", "platform24"]

  - id: platform4
    name: Market Data Processing
    consumes:
      - name: raw_ticks
        version: ">=1.0"
    produces:
      - name: normalized_bars
        version: "1.0"
      - name: replay_events
        version: "1.0"
    allowed_imports: ["platform0", "platform1", "platform3"]
    forbidden_imports: ["platform5", "platform6", "platform7", "platform8", "platform9", "platform10", "platform11", "platform12", "platform13", "platform14", "platform15", "platform16", "platform17", "platform18", "platform19", "platform20", "platform21", "platform22", "platform23", "platform24"]

  - id: platform5
    name: Mathematical Core
    consumes:
      - name: numeric_series
        version: ">=1.0"
    produces:
      - name: math_results
        version: "1.0"
    allowed_imports: ["platform0"]
    forbidden_imports: ["platform6", "platform7", "platform8", "platform9", "platform10", "platform11", "platform12", "platform13", "platform14", "platform15", "platform16", "platform17", "platform18", "platform19", "platform20", "platform21", "platform22", "platform23", "platform24"]

  - id: platform6
    name: State Engine
    consumes:
      - name: raw_events
        version: ">=1.0"
    produces:
      - name: incremental_state
        version: "1.0"
    allowed_imports: ["platform0"]
    forbidden_imports: ["platform7", "platform8", "platform9", "platform10", "platform11", "platform12", "platform13", "platform14", "platform15", "platform16", "platform17", "platform18", "platform19", "platform20", "platform21", "platform22", "platform23", "platform24"]

  - id: platform7
    name: Indicator Engine
    consumes:
      - name: normalized_bars
        version: ">=1.0"
      - name: math_results
        version: ">=1.0"
    produces:
      - name: indicator_values
        version: "1.0"
    allowed_imports: ["platform0", "platform4", "platform5", "platform6"]
    forbidden_imports: ["platform8", "platform9", "platform10", "platform11", "platform12", "platform13", "platform14", "platform15", "platform16", "platform17", "platform18", "platform19", "platform20", "platform21", "platform22", "platform23", "platform24"]

  - id: platform8
    name: Analysis Framework
    consumes:
      - name: indicator_values
        version: ">=1.0"
      - name: incremental_state
        version: ">=1.0"
    produces:
      - name: ZoneDTO
        version: "2.0"
      - name: analysis_states
        version: "1.0"
    allowed_imports: ["platform0", "platform4", "platform5", "platform6", "platform7"]
    forbidden_imports: ["platform9", "platform10", "platform11", "platform12", "platform13", "platform14", "platform15", "platform16", "platform17", "platform18", "platform19", "platform20", "platform21", "platform22", "platform23", "platform24"]

  - id: platform9
    name: Feature Platform
    consumes:
      - name: ZoneDTO
        version: ">=2.0"
      - name: analysis_states
        version: ">=1.0"
    produces:
      - name: ConceptDTO
        version: "1.0"
    allowed_imports: ["platform0", "platform6", "platform8"]
    forbidden_imports: ["platform10", "platform11", "platform12", "platform13", "platform14", "platform15", "platform16", "platform17", "platform18", "platform19", "platform20", "platform21", "platform22", "platform23", "platform24"]

  - id: platform10
    name: Concept Platform
    consumes:
      - name: ConceptDTO
        version: ">=1.0"
      - name: analysis_states
        version: ">=1.0"
    produces:
      - name: MethodologyDTO
        version: "1.0"
    allowed_imports: ["platform0", "platform6", "platform8", "platform9"]
    forbidden_imports: ["platform11", "platform12", "platform13", "platform14", "platform15", "platform16", "platform17", "platform18", "platform19", "platform20", "platform21", "platform22", "platform23", "platform24"]

  - id: platform11
    name: Market State Platform
    consumes:
      - name: MethodologyDTO
        version: ">=1.0"
      - name: analysis_states
        version: ">=1.0"
    produces:
      - name: MarketStateDTO
        version: "1.0"
    allowed_imports: ["platform0", "platform6", "platform8", "platform9", "platform10"]
    forbidden_imports: ["platform12", "platform13", "platform14", "platform15", "platform16", "platform17", "platform18", "platform19", "platform20", "platform21", "platform22", "platform23", "platform24"]
