analysis_contract:
  name: Analysis Contract
  description: Standard analysis contract definition.
  version: 1.0.0
  inputs:
  - name: market_data
    type: DataFrame
    required: true
  - name: timeframe
    type: str
    required: true
  - name: parameters
    type: Dict[str, Any]
    required: false
  outputs:
  - name: score
    type: float
    description: -1.0 to 1.0
  - name: signals
    type: List[Signal]
    required: false
  - name: raw_data
    type: DataFrame
    required: true
  invariants:
  - score_between_minus_one_and_one
  - raw_data_matches_input_index
