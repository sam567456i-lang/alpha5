# AlphaGrid Validation Registry
# Maps validator nodes and their execution dependencies (DAG)

profiles:
  quick:
    - repository_validator
    - import_validator
    - registry_validator
    - dependency_validator
    - ast_math_validator
    - indicator_metadata_validator
    - indicator_formula_validator
    - indicator_warmup_validator
    - architecture_drift_validator
    - dataset_validator
    - mathematical_validator
    - determinism_validator
    - numerical_precision_validator
    - warmup_validator
    - stability_validator
    - benchmark_validator
  family:
    - quick
    - pipeline_validator
    - deterministic_replay_validator
    - numerical_robustness_validator
  phase:
    - family
    - performance_validator
    - memory_validator
    - complexity_validator
  release:
    - phase
    - stress_validator
    - documentation_validator
    - migration_validator
    - config_drift_validator
  production:
    - release
    - phase_freeze_validator
    - evidence_generator
    
validators:
  - id: dataset_validator
    class: DatasetValidator
    category: A
    blocking: true
    dependencies: [dependency_validator]
    minimum_phase: 10
  - id: dependency_validator
    class: DependencyValidator
    category: A
    blocking: true
    dependencies: []
    minimum_phase: 1
  - id: ast_math_validator
    class: AstMathValidator
    category: A
    blocking: true
    dependencies: []
    minimum_phase: 1
  - id: indicator_metadata_validator
    class: IndicatorMetadataValidator
    category: A
    blocking: true
    dependencies: []
    minimum_phase: 1
  - id: indicator_formula_validator
    class: IndicatorFormulaValidator
    category: A
    blocking: true
    dependencies: [indicator_metadata_validator]
    minimum_phase: 1
  - id: indicator_warmup_validator
    class: IndicatorWarmupValidator
    category: A
    blocking: true
    dependencies: [indicator_formula_validator]
    minimum_phase: 1
  - id: architecture_drift_validator
    class: ArchitectureDriftValidator
    category: A
    blocking: true
    dependencies: []
    minimum_phase: 1
  - id: legacy_equivalence_validator
    class: LegacyEquivalenceValidator
    category: A
    blocking: true
    dependencies: []
    minimum_phase: 10
  - id: mathematical_validator
    class: MathematicalValidator
    category: A
    blocking: true
    dependencies: [dataset_validator]
    minimum_phase: 10
  - id: determinism_validator
    class: DeterminismValidator
    category: A
    blocking: true
    dependencies: [mathematical_validator]
    minimum_phase: 10
  - id: numerical_precision_validator
    class: NumericalPrecisionValidator
    category: A
    blocking: true
    dependencies: [determinism_validator]
    minimum_phase: 10
  - id: warmup_validator
    class: WarmupValidator
    category: A
    blocking: true
    dependencies: [numerical_precision_validator]
    minimum_phase: 10
  - id: stability_validator
    class: StabilityValidator
    category: A
    blocking: true
    dependencies: [warmup_validator]
    minimum_phase: 10
  - id: benchmark_validator
    class: BenchmarkValidator
    category: A
    blocking: true
    dependencies: [stability_validator]
    minimum_phase: 10
  - id: complexity_validator
    class: ComplexityValidator
    category: A
    blocking: true
    dependencies: [pipeline_validator]
    minimum_phase: 10
  - id: repository_validator
    class: RepositoryValidator
    category: A
    blocking: true
    dependencies: []
    minimum_phase: 1
    
  - id: registry_validator
    class: RegistryValidator
    category: A
    blocking: true
    dependencies: []
    minimum_phase: 1
    
  - id: dto_validator
    class: DTOValidator
    category: A
    blocking: true
    dependencies: []
    minimum_phase: 1
    
  - id: config_validator
    class: ConfigValidator
    category: A
    blocking: true
    dependencies: []
    minimum_phase: 1
    
  - id: api_validator
    class: APIValidator
    category: A
    blocking: true
    dependencies: []
    minimum_phase: 1
    
  - id: import_validator
    class: ImportValidator
    category: A
    blocking: true
    dependencies: []
    minimum_phase: 1
    
  - id: capability_validator
    class: CapabilityValidator
    category: A
    blocking: true
    dependencies: [registry_validator]
    minimum_phase: 1

  # Pipeline Validators (Split)
  - id: feature_pipeline_validator
    class: FeaturePipelineValidator
    category: A
    blocking: true
    dependencies: [capability_validator]
    minimum_phase: 5
    
  - id: concept_pipeline_validator
    class: ConceptPipelineValidator
    category: A
    blocking: true
    dependencies: [feature_pipeline_validator]
    minimum_phase: 7
    
  - id: methodology_pipeline_validator
    class: MethodologyPipelineValidator
    category: A
    blocking: true
    dependencies: [concept_pipeline_validator]
    minimum_phase: 8
    
  - id: signal_pipeline_validator
    class: SignalPipelineValidator
    category: A
    blocking: true
    dependencies: [methodology_pipeline_validator]
    minimum_phase: 9
    
  - id: strategy_pipeline_validator
    class: StrategyPipelineValidator
    category: A
    blocking: true
    dependencies: [signal_pipeline_validator]
    minimum_phase: 10
    
  - id: e2e_pipeline_validator
    class: E2EPipelineValidator
    category: A
    blocking: true
    dependencies: [strategy_pipeline_validator]
    minimum_phase: 10
    
  - id: pipeline_validator  # Meta validator that ensures the whole chain runs
    class: MetaPipelineValidator
    category: A
    blocking: true
    dependencies: [e2e_pipeline_validator]
    minimum_phase: 10

  - id: deterministic_replay_validator
    class: DeterministicReplayValidator
    category: A
    blocking: true
    dependencies: [pipeline_validator]
    minimum_phase: 10
    
  - id: numerical_robustness_validator
    class: NumericalRobustnessValidator
    category: A
    blocking: true
    dependencies: [pipeline_validator]
    minimum_phase: 10
    
  - id: performance_validator
    class: PerformanceValidator
    category: A
    blocking: true
    dependencies: [pipeline_validator]
    minimum_phase: 10
    
  - id: memory_validator
    class: MemoryValidator
    category: A
    blocking: true
    dependencies: [pipeline_validator]
    minimum_phase: 10
    
  - id: stress_validator
    class: StressValidator
    category: A
    blocking: true
    dependencies: [pipeline_validator]
    minimum_phase: 10
    
  - id: documentation_validator
    class: DocumentationValidator
    category: A
    blocking: true
    dependencies: []
    minimum_phase: 1
    
  - id: migration_validator
    class: MigrationValidator
    category: A
    blocking: true
    dependencies: []
    minimum_phase: 1
    
  - id: config_drift_validator
    class: ConfigDriftValidator
    category: A
    blocking: true
    dependencies: []
    minimum_phase: 1

  # Final Governance Validators
  - id: phase_freeze_validator
    class: PhaseFreezeValidator
    category: A
    blocking: true
    dependencies: [repository_validator, capability_validator, documentation_validator, deterministic_replay_validator, performance_validator]
    minimum_phase: 1
    
  - id: evidence_generator
    class: EvidenceGenerator
    category: A
    blocking: false
    dependencies: [phase_freeze_validator]
    minimum_phase: 1
