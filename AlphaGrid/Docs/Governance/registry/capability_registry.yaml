entries:
- id: CON-LIQ-PDH
  ontology_ref: ONT-LIQ-LIQ-PDH
  name: PDH Concept
  type: Concept
  versions:
    schema: 1.0.0
    implementation: 1.0.0
    registry: 1.0.0
  ownership:
    platform: Platform 9
    component: Concept Platform
    registry: Concept Registry
    plugin: PDHConceptPlugin
  contracts:
    consumes:
    - GeometrySnapshotDTO
    produces:
    - PDHConceptDTO
    events_emitted:
    - ConceptDetectedEvent
  data_requirements:
  - OHLC
  markets:
  - Forex
  - Crypto
  - Futures
  evidence_sources:
  - Geometry
  - Structure
  computational_profile:
    latency_budget: 10ms
    memory_budget: 25MB
    incremental: true
    replay: Supported
  status:
    design: Approved
    implementation: Planned
  configuration:
    detector: TimeBasedLiquidityDetector
    tolerance: &id001
      type: absolute
      value: 0
    confidence_model: static
    lineage_required: true
    latency_budget_ms: 10
    replay_supported: true
    deterministic: true
    supported_markets: &id002
    - CRYPTO
    - FX
    - EQUITY
    supported_sessions: &id003
    - ALL
    timeframe: DAY
    lookback: 1
    detection_mode: PREV_HIGH
