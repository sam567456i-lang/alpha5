decisions:
- id: DEC-001
  date: '2026-07-07'
  status: Active
  category: Governance
  description: Enshrined the Permanent Governance Directive into .agents/AGENTS.md
    to enforce AI continuity.
  alternatives_considered:
  - Relying on manual user prompting
  - Storing only in markdown
  evidence: Previous architectural drift during extended AI sessions.
  impact: All future AI execution is structurally bound by 17 rules.
  owner: Architecture Board
  approval: Approved by Human
  supersedes: None
  related_platforms:
  - All
  related_documents:
  - AGENTS.md
  - Project_Bible.md
  related_freezes:
  - Freeze_v3
- id: DEC-012
  date: '2026-07-08'
  status: Active
  category: Governance
  description: Bisection of monolithic roadmap into framework_roadmap.yaml, capability_expansion_roadmap.yaml,
    and release_roadmap.yaml.
  alternatives_considered:
  - Keeping all items in capability roadmap
  evidence: Risk of confusing framework stability with analytical delivery milestones.
  impact: Framework infrastructure progresses slowly, capability milestones progress
    independently.
  owner: Architecture Board
  approval: Approved by Human
  supersedes: None
  related_platforms:
  - All
  related_documents:
  - framework_roadmap.yaml
  related_freezes:
  - Wave5B
- id: DEC-013
  date: '2026-07-08'
  status: Active
  category: Architecture
  description: Implementation of Methodology SDK Plugin Sandbox Contract, 16-point
    Freeze Gate, and discrete Plugin Registry.
  alternatives_considered:
  - Hardcoded execution
  - Single yaml methodology registry
  evidence: Need to prevent plugin IO pollution and methodology definitions becoming
    unmaintainable.
  impact: Methodology definitions are pure. Plugins are pre-flight validated, strongly
    isolated, and sandbox-bound. External I/O strictly prohibited inside plugins.
  owner: Architecture Board
  approval: Approved by Human
  supersedes: None
  related_platforms:
  - Platform 10
  related_documents:
  - platform10_boundary_contract.md
  - methodology_plugin_registry.yaml
  - methodology_sdk.py
  related_freezes:
  - Wave5B

  - id: ADR-028
    title: Tier 0 Freeze Gate and Certification
    date: 2026-07-08
    status: ACCEPTED
    description: Enforces a strict 16-point certification gate (Functional, Contract, Dependency, Planner, Sandbox, Replay, Migration, Serialization, etc.) before any Tier 1 logic can be authored. Elevates RuleEvidenceDTO to a strictly governed registry contract. Introduces Golden Datasets for deterministic baseline validation.

  ADR-029:
    title: "Phase 1 Framework Freeze & Capability Shift"
    date: "2026-07-08"
    status: "Accepted"
    context: "The analytical framework infrastructure has reached maturity. All DTO hierarchies, governance registries, and planning mechanisms are in place."
    decision: "Freeze the framework. Shift all focus to capability development (Tier 1 Rules)."
    consequences: "No further generic scaffolding will be added unless proven necessary by an implementation blocker."

  ADR-030:
    title: "Framework Evolution Policy"
    date: "2026-07-08"
    status: "Accepted"
    context: "To prevent framework creep during Tier 1 development, we need strict rules on when to expand infrastructure."
    decision: "Framework changes are exception-based. Capability development is the default. New capabilities must not introduce framework abstractions unless a demonstrated implementation blocker exists."
    consequences: "Framework changes require evidence from at least one implemented capability that cannot be expressed using the existing contracts."

  ADR-031:
    title: "Terminology Agnosticism"
    date: "2026-07-08"
    status: "Accepted"
    context: "Defining core capabilities using methodology-specific terms (like CHOCH or MSS) tightly couples the analytical core to one narrative, limiting reuse."
    decision: "The analytical core must only emit objective, geometric facts (e.g. TrendReversalEvent). It must not use interpretive labels. Methodology Plugins are responsible for mapping these objective facts into their own terminology using the concept_mapping_registry."
    consequences: "Core capabilities are decoupled from subjective methodologies, enhancing reuse across ICT, Wyckoff, and AMT."
