- id: cap_engine_composite_synthesis
  category: Synthesis
  family: Institutional Synthesis
  name: Composite Methodology Synthesis Engine
  platform: Platform 11
  version: 1.0.0
  implementation_status: implemented
  lifecycle_state: Frozen
  activation:
    enabled: true
    required_phase: 11
  metadata:
    interaction_policies:
    - Increase Weight
    - Reduce Uncertainty
    - Increase Reliability
    - Add Supporting Evidence
    - Suppress
    - Reduce Applicability
    - Increase Conflict
    pipeline:
    - stage: Normalizer
      priority: 1
      dependencies: []
      failure_policy: continue
      retry_policy: none
      output_contract: NormalizedMethodologyDict
    - stage: Compatibility
      priority: 2
      dependencies:
      - Normalizer
      failure_policy: continue
      retry_policy: none
      output_contract: CompatibilityMatrix
    - stage: Interaction
      priority: 3
      dependencies:
      - Normalizer
      - Compatibility
      failure_policy: continue
      retry_policy: none
      output_contract: InteractionGraph
    - stage: Conflict
      priority: 4
      dependencies:
      - Interaction
      failure_policy: continue
      retry_policy: none
      output_contract: ContradictionGraph
    - stage: Consensus
      priority: 5
      dependencies:
      - Conflict
      failure_policy: continue
      retry_policy: none
      output_contract: ConsensusMetrics
    - stage: Evidence
      priority: 6
      dependencies:
      - Consensus
      failure_policy: continue
      retry_policy: none
      output_contract: EvidenceDTO
    - stage: Explainability
      priority: 7
      dependencies:
      - Evidence
      failure_policy: continue
      retry_policy: none
      output_contract: ExplainabilityDTO
    - stage: Intent
      priority: 8
      dependencies:
      - Consensus
      failure_policy: fail_fast
      retry_policy: none
      output_contract: NumericalIntentVector

- id: cap_platform_opportunity_detection
  name: Opportunity Detection Platform
  description: Consumes composite market intent and detects valid structural opportunities via registered evaluators.
  domain: Opportunity
  layer: Decision
  platform: Platform 12
  version: 1.0.0
  implementation_status: candidate
  lifecycle_state: Development
  activation:
    enabled: true
    required_phase: 12
  metadata:
    opportunity_profiles:
      - profile_id: opp_profile_trend_continuation
        name: Trend Continuation Profile
        version: 1.0.0
        schema_version: 1.0
        compatibility_version: 1.0
        required_methodologies: [Trend, Momentum]
        required_regimes: [Trending, HighVolatility]
        required_consensus: 0.7
        required_reliability: 0.6
        required_applicability: 0.8
        required_evidence: true
        execution_policies: [standard_trend]
      - profile_id: opp_profile_mean_reversion
        name: Mean Reversion Profile
        version: 1.0.0
        schema_version: 1.0
        compatibility_version: 1.0
        required_methodologies: [MeanReversion]
        required_regimes: [Ranging, VolatilityCompression]
        required_consensus: 0.8
        required_reliability: 0.7
        required_applicability: 0.8
        required_evidence: true
        execution_policies: [fade_extremes]
    opportunity_evaluators:
      - evaluator_id: cap_evaluator_trend_opportunity
        name: Trend Opportunity Evaluator
        version: 1.0.0
        required_methodologies: [Trend]
        produces_opportunity_types: [Trend Continuation]
        performance_budget: 10ms
        replay_compatibility: strict
      - evaluator_id: cap_evaluator_reversion_opportunity
        name: Mean Reversion Opportunity Evaluator
        version: 1.0.0
        required_methodologies: [MeanReversion]
        produces_opportunity_types: [Mean Reversion]
        performance_budget: 10ms
        replay_compatibility: strict
    pipeline:
    - stage: Eligibility Filter
      priority: 1
      dependencies: []
      failure_policy: fail_fast
      output_contract: EligibleCandidatesDTO
    - stage: Market Context Filter
      priority: 2
      dependencies: [Eligibility Filter]
      failure_policy: continue
      output_contract: ContextFilteredCandidatesDTO
    - stage: Session Filter
      priority: 3
      dependencies: [Market Context Filter]
      failure_policy: continue
      output_contract: SessionFilteredCandidatesDTO
    - stage: Instrument Filter
      priority: 4
      dependencies: [Session Filter]
      failure_policy: continue
      output_contract: InstrumentFilteredCandidatesDTO
    - stage: Liquidity Filter
      priority: 5
      dependencies: [Instrument Filter]
      failure_policy: fail_fast
      output_contract: LiquidityFilteredCandidatesDTO
    - stage: Classification
      priority: 6
      dependencies: [Liquidity Filter]
      failure_policy: continue
      output_contract: ClassifiedOpportunitiesDTO
    - stage: Opportunity Strength
      priority: 7
      dependencies: [Classification]
      failure_policy: continue
      output_contract: ScoredOpportunitiesDTO
    - stage: Opportunity Evidence
      priority: 8
      dependencies: [Opportunity Strength]
      failure_policy: continue
      output_contract: EvidenceBackedOpportunitiesDTO
    - stage: Opportunity Trace
      priority: 9
      dependencies: [Opportunity Evidence]
      failure_policy: fail_fast
      output_contract: OpportunityDetectionDTO


- id: cap_platform_opportunity_evaluation
  name: Opportunity Evaluation and Prioritization Platform
  description: Evaluates, scores, and prioritizes detected opportunities.
  domain: Opportunity
  layer: Decision
  platform: Platform 13
  version: 1.0.0
  implementation_status: candidate
  lifecycle_state: Development
  activation:
    enabled: true
    required_phase: 13
  metadata:
    evaluation_profiles:
      - profile_id: eval_profile_standard
        name: Standard Evaluation Profile
        version: 1.0.0
        required_policies: [standard_scoring, strict_competition, standard_queue]
    scoring_policies:
      - policy_id: standard_scoring
        weights:
          quality: 0.4
          reliability: 0.3
          applicability: 0.2
          structural_risk_penalty: 0.1
    ranking_policies:
      - policy_id: strict_ranking
        sort_by: [composite_score, urgency]
        order: descending
    competition_policies:
      - policy_id: strict_competition
        resolution: highest_score_wins
        allow_nested: true
    queue_policies:
      - policy_id: standard_queue
        max_active_duration: 3600
        promotion_threshold: 0.8
    plugins:
      - id: plugin_quality_assessor
        type: Assessment
        name: Standard Quality Assessor
      - id: plugin_structural_risk_estimator
        type: Assessment
        name: Structural Risk Estimator
      - id: plugin_competition_resolver
        type: Policy
        name: Strict Competition Resolver
      - id: plugin_composite_scorer
        type: Builder
        name: Composite Score Builder
      - id: plugin_queue_manager
        type: Lifecycle
        name: Opportunity Queue Manager
    pipeline:
    - stage: Assessment
      priority: 1
      dependencies: []
      failure_policy: continue
      output_contract: AssessedOpportunitiesDTO
    - stage: Competition
      priority: 2
      dependencies: [Assessment]
      failure_policy: continue
      output_contract: CompetitionGraphDTO
    - stage: Scoring
      priority: 3
      dependencies: [Competition]
      failure_policy: fail_fast
      output_contract: ScoredOpportunitiesDTO
    - stage: Ranking
      priority: 4
      dependencies: [Scoring]
      failure_policy: fail_fast
      output_contract: RankedOpportunitiesDTO
    - stage: Queue
      priority: 5
      dependencies: [Ranking]
      failure_policy: continue
      output_contract: EvaluatedOpportunityCollectionDTO


- id: cap_platform_recommendation_generation
  name: Recommendation Generation Platform
  description: Converts evaluated opportunities into actionable execution recommendations.
