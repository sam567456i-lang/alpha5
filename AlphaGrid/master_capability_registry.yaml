recommendation_registry:
  profiles:
    - profile_id: rec_profile_trend_continuation
      name: Trend Continuation Recommendation
      required_opportunity_types: [trend_continuation]
      required_confidence: 0.8
      entry_policy: zone_entry
      stop_policy: atr_stop
      target_policy: dynamic_trail
      scaling_policy: scale_out_halves
      exit_policy: trailing_stop_hit
      validation_policy: strict_rr_validation
      lifecycle_policy: standard_lifecycle

recommendation_policy_registry:
  entry_policies:
    - id: zone_entry
      type: zone
      buffer_percent: 0.1
    - id: twap_entry
      type: time_weighted
      duration_minutes: 60
  stop_policies:
    - id: atr_stop
      type: volatility
      multiplier: 2.0
    - id: structural_stop
      type: structural
  target_policies:
    - id: dynamic_trail
      type: trailing
      activation_rr: 1.0
    - id: liquidity_target
      type: liquidity_pool
  scaling_policies:
    - id: scale_out_halves
      type: partial_exit
      fractions: [0.5, 0.5]
  exit_policies:
    - id: trailing_stop_hit
      type: automatic
  validation_policies:
    - id: strict_rr_validation
      min_rr: 2.0
      ensure_entry_before_stop: true
  expiration_policies:
    - id: standard_expiration
      time_in_force_minutes: 120
