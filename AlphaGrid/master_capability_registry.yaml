      - id: plugin_stop_generator
        type: Generator
        name: Structural Stop Generator
      - id: plugin_target_generator
        type: Generator
        name: Fixed R:R Target Generator
      - id: plugin_structure_analyzer
        type: Analyzer
        name: Trade Structure Analyzer
      - id: plugin_recommendation_builder
        type: Builder
        name: Recommendation Builder
    pipeline:
    - stage: EntryGeneration
      priority: 1
      dependencies: []
      failure_policy: fail_fast
    - stage: StopGeneration
      priority: 2
      dependencies: [EntryGeneration]
      failure_policy: fail_fast
    - stage: TargetGeneration
      priority: 3
      dependencies: [StopGeneration]
      failure_policy: fail_fast
    - stage: StructureAnalysis
      priority: 4
      dependencies: [TargetGeneration]
      failure_policy: fail_fast
    - stage: RecommendationBuilding
      priority: 5
      dependencies: [StructureAnalysis]
      failure_policy: fail_fast

